<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site 100% Blocker✅</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Site 100% Blocker✅</h1>
    
    <div class="add-section">
      <input type="text" id="urlInput" placeholder="Enter the domain to block">
      <button id="addBtn">Add</button>
    </div>

    <div class="blocked-list">
      <h2>Blocked Sites</h2>
      <div id="sitesList" class="sites-list">
        <!-- 차단된 사이트 목록이 여기에 표시됩니다 -->
      </div>
      <div id="emptyMessage" class="empty-message">
        No sites are blocked
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
